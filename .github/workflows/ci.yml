name: CI

# Dispara automaticamente em push para main e em pull requests
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Roda em duas versões de Python para garantir compatibilidade
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 🔍 Ruff — análise estática e linting
        run: ruff check src/ tests/

      - name: 🧪 Pytest — testes automatizados
        run: pytest tests/ -v --tb=short
